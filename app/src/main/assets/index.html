<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>SpareBeam</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui,sans-serif; background:#111715; color:#f4f7f5 }
    body { max-width:900px; margin:40px auto; padding:0 20px }
    a { color:#8cf5cc; overflow-wrap:anywhere }
    .item { padding:16px 0; border-bottom:1px solid #34413b }
    video,audio,img { display:block; max-width:100%; max-height:70vh; margin-top:12px; border-radius:12px }
    input,button { font:inherit; padding:12px; border-radius:10px }
    button { background:#8cf5cc; border:0; color:#102019; font-weight:650 }
    #error { color:#ffb4ab; min-height:1.5em }
  </style>
</head>
<body>
  <header><h1>SpareBeam</h1><p>Your media on your network.</p></header>
  <form id="pair">
    <label for="pin">Enter the six-digit pairing code shown in SpareBeam</label>
    <p><input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required><button>Connect</button></p>
    <p id="error" role="status" aria-live="polite"></p>
  </form>
  <main id="files" aria-live="polite"></main>
  <script>
    const form = document.getElementById('pair');
    const error = document.getElementById('error');
    const files = document.getElementById('files');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.textContent = 'Connecting…';
      try {
        const response = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: document.getElementById('pin').value })
        });
        if (!response.ok) throw new Error('Code not accepted. Check the code and try again.');
        form.hidden = true;
        await loadLibrary();
      } catch (cause) {
        error.textContent = cause.message || 'Could not connect. Try again.';
      }
    });

    async function loadLibrary() {
      try {
        const response = await fetch('/api/list');
        if (!response.ok) throw new Error('Pair this browser to continue.');
        const entries = await response.json();
        files.replaceChildren();
        if (!entries.length) {
          files.textContent = 'No media files found in the shared folders.';
          return;
        }
        for (const entry of entries) {
          const section = document.createElement('section');
          section.className = 'item';
          const link = document.createElement('a');
          link.href = entry.url;
          link.textContent = entry.name;
          section.append(link);
          let player;
          if (entry.type.startsWith('video/')) {
            player = document.createElement('video');
            player.controls = true;
            player.preload = 'metadata';
          } else if (entry.type.startsWith('audio/')) {
            player = document.createElement('audio');
            player.controls = true;
            player.preload = 'metadata';
          } else if (entry.type.startsWith('image/')) {
            player = document.createElement('img');
            player.alt = entry.name;
            player.loading = 'lazy';
          }
          if (player) {
            player.src = entry.url;
            section.append(player);
          }
          files.append(section);
        }
      } catch (cause) {
        files.textContent = cause.message || 'Could not load media.';
        form.hidden = false;
      }
    }
    loadLibrary();
  </script>
</body>
</html>
